name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the floor and pins imbalanced-learn to 0.12.x; 3.11 gets 0.13+.
        # Both are tested because the resampling path differs between them.
        python-version: ["3.9", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # [fmri] pulls nilearn + nibabel so the NARPS BIDS load path and its
          # demo are exercised in CI rather than skipped.
          pip install -e ".[dev,fmri]"

      - name: Lint
        run: ruff check src tests scripts

      - name: Test
        run: pytest -q

      # The synthetic ground-truth check exits non-zero if the pipeline stops
      # recovering the dissociation it is built to detect. Treat a failure here
      # as a broken pipeline, not a flaky demo.
      - name: Ground-truth recovery check
        run: python scripts/run_demo.py --quick

      # Same check on the real DEAP file format (synthetic fixture, no download).
      # Fails if the loader miswires stimulus keys or the asymmetry features.
      - name: DEAP-format recovery check
        run: python scripts/run_deap.py --demo

      # Same check on the real NARPS BIDS format (synthetic fixture, no
      # download). Fails if the loader miswires events, ROI extraction, or
      # confounds. Honest claim only: fMRI predicts accept above chance, no
      # brain-beats-behaviour assertion (gambles favour the economic baseline).
      - name: NARPS-format recovery check
        run: python scripts/run_narps.py --demo
